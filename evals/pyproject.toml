[project]
name = "jobtrack-evals"
version = "0.1.0"
description = "Labelled datasets, eval runners, and report generation."
requires-python = ">=3.12,<3.13"
dependencies = [
  "jobtrack-core",
  "typer>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobtrack_evals"]
