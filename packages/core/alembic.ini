# Alembic connects as the schema owner, never as the application role. The URL is
# built in env.py from settings rather than written here, so a password never lands
# in a committed file.

[alembic]
# %(here)s is the directory holding this file, so alembic can be invoked
# from the repository root or from packages/core and resolve the same way.
script_location = %(here)s/src/jobtrack_core/db/migrations
prepend_sys_path = %(here)s/src
path_separator = os
# Migration filenames sort by revision number, so history reads in order on disk.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
