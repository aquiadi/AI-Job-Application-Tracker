[project]
name = "jobtrack-core"
version = "0.1.0"
description = "Shared schemas, database session and RLS helpers, LLM client, and GCP adapter interfaces."
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.12",
  "pydantic-settings>=2.11",
  "sqlalchemy[asyncio]>=2.0.44",
  "asyncpg>=0.30",
  "pgvector>=0.4",
  "alembic>=1.16",
  "google-genai>=2.23,<3",
  "google-cloud-alloydb-connector[asyncpg]>=1.14",
  "google-cloud-storage>=3.4",
  "google-cloud-pubsub>=2.32",
  "google-cloud-tasks>=2.21",
  "google-auth>=2.43",
  "structlog>=25.5",
  # Declared rather than inherited from google-genai: the ATS adapters are a
  # first-class use of it, and a transitive dependency can be dropped by an upgrade.
  "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobtrack_core"]
