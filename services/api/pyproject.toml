[project]
name = "jobtrack-api"
version = "0.1.0"
description = "Public HTTP API. Thin routers over a pure domain layer."
requires-python = ">=3.12,<3.13"
dependencies = [
  "jobtrack-core",
  "fastapi>=0.121",
  "uvicorn[standard]>=0.38",
  # Resume upload. FastAPI needs this for multipart/form-data and says so at
  # import time rather than at request time, so it is a hard dependency.
  "python-multipart>=0.0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobtrack_api"]
