[project]
name = "jobtrack-worker"
version = "0.1.0"
description = "Pub/Sub push and Cloud Tasks handlers."
requires-python = ">=3.12,<3.13"
dependencies = [
  "jobtrack-core",
  "fastapi>=0.121",
  "uvicorn[standard]>=0.38",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobtrack_worker"]
